# Dark, black-blue theme of the BESS valuation app (see app/streamlit_app.py).
[theme]
base = "dark"
primaryColor = "#3987e5"
backgroundColor = "#0b0f17"
secondaryBackgroundColor = "#121a27"
textColor = "#e6e9ef"
borderColor = "#1e2633"
baseRadius = "6px"
font = "sans serif"

[browser]
gatherUsageStats = false
