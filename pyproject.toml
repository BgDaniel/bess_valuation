[project]
name = "bess_valuation"
version = "0.1.0"
description = "LSMC valuation and optimal dispatch of a battery (BESS) on stochastic DA and IDA1-3 prices, with a vertex library and an own Numba simplex."
authors = [
    {name = "Daniel.BergerMat@t-online.de"}
]
readme = "README.md"
requires-python = ">=3.11,<3.15"
dependencies = [
    "numpy (>=2.0,<3.0)",
    "numba (>=0.60)",
    "pandas (>=2.2)",
    "pyarrow (>=16.0)",
    "matplotlib (>=3.9,<4.0)",
    "pyyaml (>=6.0,<7.0)",
]

[tool.poetry]
packages = [{include = "bess_valuation"}]

[tool.poetry.group.dev.dependencies]
scipy = ">=1.13"
highspy = ">=1.7"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
